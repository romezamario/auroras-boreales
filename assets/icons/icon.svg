<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a1f"/>
      <stop offset="0.55" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#0f2d4a"/>
    </linearGradient>
    <linearGradient id="curtainA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b46cff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#9b6cff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3ff2b0" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#2be38f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2be38f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtainB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6cc8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#c06cff" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#3fd8f2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3fd8f2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- estrellas -->
  <g fill="#ffffff">
    <circle cx="70" cy="62" r="2.6" opacity="0.9"/>
    <circle cx="150" cy="38" r="1.8" opacity="0.7"/>
    <circle cx="300" cy="50" r="2.2" opacity="0.85"/>
    <circle cx="420" cy="80" r="2.8" opacity="0.9"/>
    <circle cx="465" cy="34" r="1.6" opacity="0.6"/>
    <circle cx="36" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="230" cy="96" r="1.4" opacity="0.5"/>
    <circle cx="480" cy="170" r="1.8" opacity="0.6"/>
  </g>
  <!-- cortina trasera -->
  <path d="M-20 300 C 60 200, 120 120, 210 150 S 360 250, 440 150 S 540 90, 540 90 L 540 330 C 450 300, 380 360, 300 330 S 120 290, -20 380 Z"
        fill="url(#curtainB)" filter="url(#glow)" opacity="0.85"/>
  <!-- cortina principal: franjas verticales que siguen una curva -->
  <g filter="url(#glow)">
    <path d="M-10 250 C 70 140, 150 110, 230 170 S 380 290, 520 180 L 520 400 C 400 430, 330 360, 240 370 S 60 420, -10 440 Z"
          fill="url(#curtainA)"/>
  </g>
  <g filter="url(#soft)" opacity="0.8">
    <path d="M-10 270 C 70 160, 150 130, 230 190 S 380 310, 520 200" fill="none" stroke="#c9ffe9" stroke-width="5" stroke-opacity="0.75"/>
  </g>
  <g fill="#7dffcf" opacity="0.18" filter="url(#soft)">
    <rect x="40" y="200" width="10" height="200"/>
    <rect x="95" y="170" width="8" height="220"/>
    <rect x="150" y="150" width="12" height="230"/>
    <rect x="215" y="170" width="9" height="210"/>
    <rect x="275" y="215" width="11" height="170"/>
    <rect x="335" y="240" width="8" height="150"/>
    <rect x="395" y="220" width="12" height="170"/>
    <rect x="455" y="190" width="9" height="200"/>
  </g>
  <!-- montañas -->
  <path d="M0 512 L0 400 L70 352 L120 390 L190 318 L250 380 L300 345 L370 400 L430 350 L512 392 L512 512 Z" fill="#06101f"/>
  <path d="M0 512 L0 440 L90 410 L160 445 L240 405 L330 450 L410 420 L512 452 L512 512 Z" fill="#030812"/>
</svg>
