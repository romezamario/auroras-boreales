# Flujo simple para desplegar contenido estático a GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta en pushes a la rama principal
  push:
    branches: ["main"]

  # Permite ejecución manual desde la pestaña Actions
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Fuerza la ejecución de acciones JavaScript con Node.js 24 para adelantarse
# al cambio anunciado por GitHub y evitar warnings por runtime Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Un despliegue a la vez. No se cancela el que está en curso (un despliegue cortado
# a medias puede dejar Pages en un estado intermedio); si llegan varios pushes
# seguidos, GitHub deja en cola solo el más reciente.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Trabajo único de despliegue del sitio completo
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build deploy bundle without collected artifacts
        run: |
          rm -rf ./dist
          mkdir -p ./dist
          rsync -a ./ ./dist/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'AGENTS.md' \
            --exclude 'scripts/' \
            --exclude 'tests/' \
            --exclude 'data/history/'
      - name: Inject version metadata
        # La versión visible en "Estado de datos" sale del commit desplegado,
        # así no hay que actualizar js/config.js a mano.
        run: |
          DATE="$(git log -1 --format=%cI)"
          LABEL="$(git log -1 --format=%cs) · ${GITHUB_SHA::7}"
          sed -i -E \
            -e "s|^([[:space:]]*)label: \"[^\"]*\",|\1label: \"${LABEL}\",|" \
            -e "s|^([[:space:]]*)updatedAt: \"[^\"]*\",|\1updatedAt: \"${DATE}\",|" \
            -e "s|^([[:space:]]*)source: \"embedded\",|\1source: \"deploy\",|" \
            dist/js/config.js
          grep -nE "^[[:space:]]*(label|updatedAt|source):" dist/js/config.js
      - name: Cache-busting de JS y CSS
        # GitHub Pages sirve todo con caché de 10 min. Sin esto, tras un despliegue el
        # navegador puede mezclar el index.html nuevo con scripts viejos (o al revés) y
        # el globo falla con un error de JavaScript. Con ?v=<commit> cada versión
        # pide sus propios archivos.
        run: |
          V="${GITHUB_SHA::7}"
          for f in dist/*.html; do
            sed -i -E "s#(src|href)=\"((js/|style\.css|versor\.js|assets/icons/|manifest\.webmanifest)[^\"?]*)\"#\1=\"\2?v=${V}\"#g" "$f"
          done
          grep -hoE '(src|href)="[^"]*\?v=[^"]*"' dist/*.html | sort | uniq -c | head -50
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
