# Junta las fotos de OVATION de la última hora para la animación del globo.
# NOAA solo publica el pronóstico más reciente, así que cada 5 min se agrega
# la foto nueva a aurora-history.json y se descartan las de más de ~1 h.
#
# El archivo vive en la rama `aurora-history`, que siempre tiene UN solo commit
# (se reemplaza con force push). Así el repo no crece con cada foto y no hace
# falta redesplegar Pages: el sitio lo lee desde raw.githubusercontent.com.
name: Collect aurora history

on:
  schedule:
    # GitHub no garantiza la hora exacta: en horas de carga puede retrasarse.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-history
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (solo el script)
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - name: Recuperar el historial anterior
        run: |
          git fetch --depth=1 origin aurora-history 2>/dev/null \
            && git show origin/aurora-history:aurora-history.json > /tmp/previous.json \
            || echo "Rama aurora-history todavía no existe; se empieza de cero."
      - name: Agregar la foto más reciente de NOAA
        env:
          PREVIOUS_PATH: /tmp/previous.json
          OUT_PATH: /tmp/out/aurora-history.json
        run: python3 scripts/ovation_history.py
      - name: Publicar en la rama aurora-history (un solo commit)
        run: |
          [ -f /tmp/out/aurora-history.json ] || { echo "Sin archivo nuevo"; exit 0; }
          cd /tmp/out
          git init -q -b aurora-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "Fotos de OVATION de la última hora para la animación del sitio." \
            "Las genera el workflow Collect aurora history; esta rama se reemplaza en cada corrida." > README.md
          git add aurora-history.json README.md
          git commit -q -m "Historial OVATION $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aurora-history
